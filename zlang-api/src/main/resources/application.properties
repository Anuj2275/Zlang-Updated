server.port=${PORT:8081}

spring.application.name=zlang-api

# Load the local overrides automatically for local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Default values; real local values should be kept in application-local.properties
spring.data.mongodb.uri=${MONGODB_URI}
jwt.secret=${JWT_SECRET}
openai.api.key=${OPENAI_API_KEY}
